trigger:
- develop  # Cambiado a develop ya que mencionas que es tu rama principal

variables:
  NODE_ENV: production
  # Azure Key Vault en lugar de variables directas
  DB_HOST: $(DB_HOST)
  DB_PORT: $(DB_PORT)
  DB_USER: $(DB_USER)
  DB_PASSWORD: $(DB_PASSWORD)
  DB_NAME: $(DB_NAME)
  JWT_SECRET: $(JWT_SECRET)

jobs:
- job: Build_NestJS_API
  displayName: 'Build NestJS API'
  pool:
    vmImage: ubuntu-latest
  steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'

  - script: npm ci
    displayName: 'Install dependencies (npm ci)'

  - script: npm run build
    displayName: 'Build NestJS project'

  # Opcional: Publicar el artefacto (dist/)
  - task: PublishBuildArtifacts@1
    displayName: 'Publish build artifacts'
    inputs:
      PathtoPublish: 'dist'
      ArtifactName: 'drop'

