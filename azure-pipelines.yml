trigger:
- develop

pool:
  name: my-nestjs-agent
  demands:
  - npm
  - node.js

steps:
# Paso crítico faltante
- checkout: self
  fetchDepth: 1
  displayName: 'Checkout código'

- task: Bash@3
  displayName: 'Configurar .env'
  inputs:
    targetType: 'inline'
    script: |
      echo "DB_HOST=$(DB_HOST)" > .env
      echo "DB_PORT=$(DB_PORT)" >> .env
      # ... resto de variables
      chmod 600 .env
  env:
    DB_HOST: $(DB_HOST)
    DB_PORT: $(DB_PORT)
    DB_USER: $(DB_USER)
    DB_PASSWORD: $(DB_PASSWORD)
    DB_NAME: $(DB_NAME)
    JWT_SECRET: $(JWT_SECRET)

- script: |
    npm ci
    npm run build
  displayName: 'Instalar y construir'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'dist'
    ArtifactName: 'drop'