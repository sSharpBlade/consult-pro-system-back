trigger:
- develop  # O la rama que uses para CI

variables:
  NODE_ENV: production

pool:
  vmImage: ubuntu-latest

container: node:20-alpine  # Imagen ligera con Node 20

steps:
- script: echo "Instalando dependencias..."
  displayName: 'Preparar entorno'

# Paso para manejar variables de entorno (alternativa segura a .env)
- bash: |
    cat << 'EOF' > .env
    DB_HOST=$(DB_HOST)
    DB_PORT=$(DB_PORT)
    DB_USER=$(DB_USER)
    DB_PASSWORD=$(DB_PASSWORD)
    DB_NAME=$(DB_NAME)
    JWT_SECRET=$(JWT_SECRET)
    EOF
  displayName: 'Crear archivo .env'
  env:
    DB_HOST: $(DB_HOST)
    DB_PORT: $(DB_PORT)
    DB_USER: $(DB_USER)
    DB_PASSWORD: $(DB_PASSWORD)
    DB_NAME: $(DB_NAME)
    JWT_SECRET: $(JWT_SECRET)

- script: |
    npm ci
    npm run build
  displayName: 'Instalar dependencias y construir'

# Opcional: Publicar el artefacto construido
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'dist'
    ArtifactName: 'drop'